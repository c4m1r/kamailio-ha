---
- name: Validate inventory and target access
  hosts: all
  gather_facts: true
  tasks:
    - name: Show host identity and platform
      ansible.builtin.debug:
        msg:
          - "inventory_hostname={{ inventory_hostname }}"
          - "ansible_host={{ ansible_host | default('not-set') }}"
          - "distribution={{ ansible_distribution | default('unknown') }}"
          - "version={{ ansible_distribution_version | default('unknown') }}"
          - "python={{ ansible_python.executable | default('unknown') }}"
    - name: Refuse non-Linux targets
      ansible.builtin.assert:
        that:
          - ansible_system == "Linux"
        fail_msg: "This automation currently supports Linux targets only."
